<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Revine Vault</title>
    <link rel="icon" href="https://i.imgur.com/lqX0zmI.jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020617; color: white; padding: 20px; }
        
        /* LOGIN SCREEN */
        #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; width: 320px; }
        .login-box input { padding: 12px; width: 100%; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .btn { background: #0ea5e9; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0284c7; transform: scale(1.02); }

        /* DASHBOARD */
        #dashboard { display: none; max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
        .menu-btn { background: #1e293b; padding: 10px 20px; border: 1px solid #334155; cursor: pointer; color: white; margin-right: 10px; border-radius: 8px; font-weight: bold; }
        .menu-btn.active { background: #0ea5e9; border-color: #0ea5e9; }

        /* FORM BOX */
        .form-box { background: #0f172a; padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 30px; }
        .form-box h3 { margin-bottom: 20px; color: #3b82f6; border-bottom: 1px dashed #334155; padding-bottom: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 12px; color: #9ca3af; margin-top: 10px; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 5px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 14px; }
        
        /* TABLE */
        .table-container { overflow-x: auto; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #0ea5e9; color: white; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 5px; font-weight: bold; }
        .edit-btn { background: #facc15; color: black; }
        .delete-btn { background: #ef4444; color: white; }

        /* SECTION DISKON PRODUK */
        .disc-prod-box { background: rgba(14, 165, 233, 0.1); padding: 15px; border-radius: 10px; border: 1px solid #0ea5e9; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <img src="https://i.imgur.com/lqX0zmI.jpeg" style="width: 70px; border-radius: 12px;">
            <h2 style="margin-top: 15px;">Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Password Rahasia...">
            <button class="btn" style="width: 100%;" onclick="checkPassword()">Masuk ke Panel</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="https://i.imgur.com/lqX0zmI.jpeg" style="width: 40px; border-radius: 8px;">
                <h2>REVINE ADMIN PANEL</h2>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <div style="background: #10b981; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 14px; border: 1px solid #059669; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);">
                    🟢 Live Visitor: <span id="liveVisitorCount" style="font-size: 18px;">0</span>
                </div>
                
                <button class="btn" style="background: #ef4444;" onclick="logout()">Logout</button>
            </div>
        </div>

        <div style="margin-bottom: 25px;">
            <button class="menu-btn active" onclick="switchTab('produk')">📦 PRODUK</button>
            <button class="menu-btn" onclick="switchTab('diskon')">🎟️ VOUCHER</button>
        </div>

        <div id="tab-produk">
            <div class="form-box">
                <h3 id="formTitleProd">Tambah / Edit Produk</h3>
                <input type="hidden" id="prodId">
                
                <div class="grid-2">
                    <div>
                        <label>Nama Produk</label>
                        <input type="text" id="prodName" placeholder="Contoh: Realms Plus">
                    </div>
                    <div>
                        <label>Kategori</label>
                        <select id="prodCat">
                            <option value="minecraft">Minecraft</option>
                            <option value="premium">Premium App</option>
                            <option value="streaming">Streaming</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Subkategori</label>
                        <input type="text" id="prodSubcat" placeholder="netflix, canva, dll">
                    </div>
                    <div>
                        <label>URL Logo Produk (Imgur/Discord)</label>
                        <input type="text" id="prodLogo" placeholder="https://i.imgur.com/...">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Harga (Angka saja)</label>
                        <input type="number" id="prodPrice" placeholder="120000">
                    </div>
                    <div>
                        <label>Stok</label>
                        <input type="number" id="prodStock" placeholder="999">
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Rating (1-5)</label>
                        <input type="text" id="prodRating" placeholder="5.0">
                    </div>
                    <div>
                        <label>Jumlah Terjual</label>
                        <input type="number" id="prodSold" placeholder="1829">
                    </div>
                </div>

                <label>Status Populer?</label>
                <select id="prodPopular">
                    <option value="false">Biasa Saja</option>
                    <option value="true">🔥 Populer (Tampil Badge)</option>
                </select>

                <label>Deskripsi Produk (Gunakan \n untuk baris baru)</label>
                <textarea id="prodDesc" rows="6" placeholder="Masukkan deskripsi lengkap..."></textarea>

                <div class="disc-prod-box">
                    <h4 style="font-size: 14px; margin-bottom: 10px;">⚡ Flash Sale / Diskon Produk (Opsional)</h4>
                    <div class="grid-2">
                        <div>
                            <label>Label Diskon (Misal: Special Discon)</label>
                            <input type="text" id="prodDiscLabel" placeholder="Special Discon">
                        </div>
                        <div>
                            <label>Persen Diskon (Contoh: 83.4)</label>
                            <input type="text" id="prodDiscPercent" placeholder="83.4">
                        </div>
                    </div>
                    <label>Berakhir Pada (Format: YYYY-MM-DDTHH:MM:SS)</label>
                    <input type="text" id="prodDiscEnd" placeholder="2026-04-30T23:59:59">
                    <p style="font-size: 10px; color: #0ea5e9; margin-top: 5px;">*Kosongkan semua field diskon jika tidak ingin ada Flash Sale.</p>
                </div>

                <button class="btn" style="background: #10b981; width: 100%; margin-top: 10px;" onclick="saveProduct()">💾 SIMPAN DATA PRODUK</button>
                <button id="cancelEditProd" class="btn" style="background: #475569; width: 100%; margin-top: 10px; display: none;" onclick="resetProdForm()">❌ BATAL EDIT</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Logo</th>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                            <th>Stok</th>
                            <th>Populer</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyProd"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-diskon" style="display: none;">
            <div class="form-box">
                <h3 id="formTitleDisc">Kelola Kode Voucher</h3>
                <input type="hidden" id="discIsEdit">
                <label>Kode Voucher</label>
                <input type="text" id="discCode" placeholder="REVINEVAULT" style="text-transform: uppercase;">
                <div class="grid-2">
                    <div>
                        <label>Persen (%)</label>
                        <input type="number" id="discPercent" placeholder="10">
                    </div>
                    <div>
                        <label>Maksimal Pakai</label>
                        <input type="number" id="discMax" placeholder="100">
                    </div>
                </div>
                <label>Tanggal Kadaluarsa</label>
                <input type="date" id="discExp">
                <button class="btn" style="background: #10b981; width: 100%; margin-top: 15px;" onclick="saveDiscount()">💾 SIMPAN VOUCHER</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Persen</th>
                            <th>Kuota</th>
                            <th>Exp</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyDisc"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkOAPq7Li_QVWvhNI8YOlpCpbpsuCz-Z0", // GANTI DENGAN API KEY LU
            authDomain: "revinestock-ccb0f.firebaseapp.com",
            databaseURL: "https://revinestock-ccb0f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "revinestock-ccb0f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db; window.ref = ref; window.get = get; window.set = set; window.update = update; window.remove = remove; window.onValue = onValue;
    </script>

    <script>
        function checkPassword() {
            if(document.getElementById("adminPassword").value === "revine123") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                initRealtimeData();
            } else { alert("❌ Password Salah Bos!"); }
        }
        function logout() { location.reload(); }

        function switchTab(tab) {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById("tab-produk").style.display = (tab==='produk'?'block':'none');
            document.getElementById("tab-diskon").style.display = (tab==='diskon'?'block':'none');
        }

        function initRealtimeData() {

// === KODE YANG BARU DITAMBAH: Hitung Pengunjung ===
            window.onValue(window.ref(window.db, "visitors"), (snap) => {
                let count = 0;
                if(snap.exists()){
                    // Ngitung ada berapa data pengunjung di Firebase
                    count = Object.keys(snap.val()).length; 
                }
                document.getElementById("liveVisitorCount").innerText = count;
            });

            window.onValue(window.ref(window.db, "products"), (snap) => {
                let html = "";
                if(snap.exists()){
                    const data = snap.val();
                    for(let id in data){
                        let p = data[id];
                        let safe = encodeURIComponent(JSON.stringify(p));
                        html += `<tr>
                            <td><img src="${p.logo}" style="width:40px; border-radius:5px;"></td>
                            <td><b>${p.name}</b><br><small style="color:#9ca3af">${p.category}</small></td>
                            <td>Rp${p.price.toLocaleString()}</td>
                            <td>${p.stock}</td>
                            <td>${p.popular === "true" || p.popular === true ? '✅' : '❌'}</td>
                            <td>
                                <button class="action-btn edit-btn" onclick="editProduct('${id}', '${safe}')">Edit</button>
                                <button class="action-btn delete-btn" onclick="deleteProduct('${id}')">Hapus</button>
                            </td>
                        </tr>`;
                    }
                }
                document.getElementById("tableBodyProd").innerHTML = html;
            });

            window.onValue(window.ref(window.db, "discountCodes"), (snap) => {
                let html = "";
                if(snap.exists()){
                    const data = snap.val();
                    for(let code in data){
                        let d = data[code];
                        html += `<tr>
                            <td><b>${code}</b></td>
                            <td>${d.percent}%</td>
                            <td>${d.used || 0} / ${d.maxUse}</td>
                            <td>${d.exp}</td>
                            <td>
                                <button class="action-btn edit-btn" onclick="editDiscount('${code}', '${encodeURIComponent(JSON.stringify(d))}')">Edit</button>
                                <button class="action-btn delete-btn" onclick="deleteDiscount('${code}')">Hapus</button>
                            </td>
                        </tr>`;
                    }
                }
                document.getElementById("tableBodyDisc").innerHTML = html;
            });
        }

        /* LOGIC PRODUK */
        async function saveProduct() {
            let id = document.getElementById("prodId").value;
            let discData = null;
            let dLabel = document.getElementById("prodDiscLabel").value;
            let dPercent = document.getElementById("prodDiscPercent").value;
            let dEnd = document.getElementById("prodDiscEnd").value;

            if(dLabel && dPercent && dEnd) {
                discData = { end: dEnd, label: dLabel, percent: parseFloat(dPercent) };
            }

            let payload = {
                name: document.getElementById("prodName").value,
                category: document.getElementById("prodCat").value,
                subcategory: document.getElementById("prodSubcat").value,
                price: parseInt(document.getElementById("prodPrice").value),
                stock: parseInt(document.getElementById("prodStock").value),
                logo: document.getElementById("prodLogo").value,
                description: document.getElementById("prodDesc").value,
                rating: document.getElementById("prodRating").value,
                sold: parseInt(document.getElementById("prodSold").value),
                popular: document.getElementById("prodPopular").value === "true",
                discount: discData
            };

            if(id) {
                await window.update(window.ref(window.db, "products/" + id), payload);
                alert("✅ Produk Berhasil Diupdate!");
            } else {
                id = "prod_" + Date.now();
                await window.set(window.ref(window.db, "products/" + id), payload);
                alert("✅ Produk Berhasil Ditambah!");
            }
            resetProdForm();
        }

        window.editProduct = function(id, safeData) {
            let p = JSON.parse(decodeURIComponent(safeData));
            document.getElementById("prodId").value = id;
            document.getElementById("prodName").value = p.name;
            document.getElementById("prodCat").value = p.category;
            document.getElementById("prodSubcat").value = p.subcategory || "";
            document.getElementById("prodPrice").value = p.price;
            document.getElementById("prodStock").value = p.stock;
            document.getElementById("prodLogo").value = p.logo;
            document.getElementById("prodDesc").value = p.description || "";
            document.getElementById("prodRating").value = p.rating || "5.0";
            document.getElementById("prodSold").value = p.sold || 0;
            document.getElementById("prodPopular").value = p.popular.toString();

            if(p.discount) {
                document.getElementById("prodDiscLabel").value = p.discount.label;
                document.getElementById("prodDiscPercent").value = p.discount.percent;
                document.getElementById("prodDiscEnd").value = p.discount.end;
            } else {
                document.getElementById("prodDiscLabel").value = "";
                document.getElementById("prodDiscPercent").value = "";
                document.getElementById("prodDiscEnd").value = "";
            }

            document.getElementById("formTitleProd").innerText = "📝 Sedang Mengedit: " + p.name;
            document.getElementById("cancelEditProd").style.display = "block";
            window.scrollTo(0,0);
        }

        window.resetProdForm = function() {
            document.getElementById("prodId").value = "";
            document.querySelectorAll("#tab-produk input, #tab-produk textarea").forEach(i => i.value = "");
            document.getElementById("prodCat").value = "minecraft";
            document.getElementById("prodPopular").value = "false";
            document.getElementById("formTitleProd").innerText = "Tambah / Edit Produk";
            document.getElementById("cancelEditProd").style.display = "none";
        }

        window.deleteProduct = async function(id) {
            if(confirm("Hapus produk ini?")) { await window.remove(window.ref(window.db, "products/" + id)); }
        }

        /* LOGIC VOUCHER (DISKON KODE) */
        async function saveDiscount() {
            let code = document.getElementById("discCode").value.toUpperCase().trim();
            let payload = {
                percent: parseInt(document.getElementById("discPercent").value),
                maxUse: parseInt(document.getElementById("discMax").value),
                exp: document.getElementById("discExp").value,
                used: 0
            };
            await window.set(window.ref(window.db, "discountCodes/" + code), payload);
            alert("✅ Voucher Berhasil Disimpan!");
            document.querySelectorAll("#tab-diskon input").forEach(i => i.value = "");
        }

        window.editDiscount = function(code, safeData) {
            let d = JSON.parse(decodeURIComponent(safeData));
            document.getElementById("discCode").value = code;
            document.getElementById("discPercent").value = d.percent;
            document.getElementById("discMax").value = d.maxUse;
            document.getElementById("discExp").value = d.exp;
            window.scrollTo(0,0);
        }

        window.deleteDiscount = async function(code) {
            if(confirm("Hapus voucher " + code + "?")) { await window.remove(window.ref(window.db, "discountCodes/" + code)); }
        }
    </script>
</body>
</html>
